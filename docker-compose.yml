# Local stand-ins for AWS services, for development (free). Reachable only from this PC.
# Security is disabled: never expose these ports or put real data or credentials in them.
#   docker compose up -d        start
#   docker compose down         stop (data kept in named volumes)
#   docker compose down -v      stop and delete the data
services:
  opensearch:  # stands in for OpenSearch Serverless
    image: opensearchproject/opensearch:2.19.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dynamodb:  # AWS's official DynamoDB Local: same API as DynamoDB
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  opensearch-data:
  dynamodb-data:
